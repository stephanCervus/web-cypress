
name: Cypress Daily Tests

on:
  # Handmatig starten via GitHub
  workflow_dispatch:

  # Iedere dag om 04:00 UTC
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  cypress:
    name: Run Cypress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Maakt cypress.env.json aan (staat lokaal in .gitignore) met de testgebruikers uit de secrets.
      # jq zorgt dat speciale tekens in wachtwoorden (zoals " of \) de JSON niet breken.
      - name: Create cypress.env.json
        env:
          GEBRUIKER_EEN_CLIENT: ${{ secrets.CYPRESS_CLIENT_NUMBER }}
          GEBRUIKER_EEN_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          GEBRUIKER_EEN_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          GEBRUIKER_TWEE_CLIENT: ${{ secrets.CYPRESS_USER2_CLIENT_NUMBER }}
          GEBRUIKER_TWEE_USERNAME: ${{ secrets.CYPRESS_USER2_USERNAME }}
          GEBRUIKER_TWEE_PASSWORD: ${{ secrets.CYPRESS_USER2_PASSWORD }}
        run: |
          jq -n '{
            gebruikerEen: {
              client: env.GEBRUIKER_EEN_CLIENT,
              username: env.GEBRUIKER_EEN_USERNAME,
              password: env.GEBRUIKER_EEN_PASSWORD
            },
            gebruikerTwee: {
              client: env.GEBRUIKER_TWEE_CLIENT,
              username: env.GEBRUIKER_TWEE_USERNAME,
              password: env.GEBRUIKER_TWEE_PASSWORD
            }
          }' > cypress.env.json

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v7
        with:
          record: true
          browser: chrome
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}
